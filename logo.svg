<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Globe with bands -->
  <defs>
    <radialGradient id="globeGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#e4ecf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfcfe0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#d49830" stroke-width="3"/>
  
  <!-- Globe -->
  <circle cx="100" cy="100" r="70" fill="url(#globeGrad)" opacity="0.9"/>
  
  <!-- Longitude lines -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#d49830" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="100" x2="150" y2="100" stroke="#d49830" stroke-width="1.5" opacity="0.6"/>
  <line x1="65" y1="40" x2="135" y2="160" stroke="#d49830" stroke-width="1.5" opacity="0.4"/>
  <line x1="135" y1="40" x2="65" y2="160" stroke="#d49830" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Latitude lines -->
  <circle cx="100" cy="100" r="50" fill="none" stroke="#d49830" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="35" fill="none" stroke="#d49830" stroke-width="1" opacity="0.5"/>
  
  <!-- Fiber strands wrapping around -->
  <path d="M 100 30 Q 145 50 150 100" fill="none" stroke="#d49830" stroke-width="2" opacity="0.8"/>
  <path d="M 100 30 Q 55 50 50 100" fill="none" stroke="#d49830" stroke-width="2" opacity="0.8"/>
  <path d="M 150 100 Q 145 150 100 170" fill="none" stroke="#d49830" stroke-width="2" opacity="0.8"/>
  <path d="M 50 100 Q 55 150 100 170" fill="none" stroke="#d49830" stroke-width="2" opacity="0.8"/>
  
  <!-- Center node/splice point -->
  <circle cx="100" cy="100" r="6" fill="#d49830"/>
  
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="6" fill="none" stroke="#d49830" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="6;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>